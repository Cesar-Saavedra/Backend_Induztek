spring.application.name=induztek-backend

# Render asigna el puerto en la variable PORT; en local se usa 8080
server.port=${PORT:8080}

# ---- Base de datos PostgreSQL ----
# Los datos de conexion vienen de variables de entorno (en Render se configuran en el panel).
# Para Neon, DB_URL es: jdbc:postgresql://<host>/<base>?sslmode=require
# Los valores despues de ":" son los que se usan en local si la variable no existe.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/induztek}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Pocas conexiones: los planes gratis de Neon/Render tienen limite
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# JPA / Hibernate: crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Las validaciones (@NotBlank, @NotEmpty...) se revisan al recibir el JSON (@Valid en los controladores).
# Se desactiva la validacion repetida de Hibernate al guardar, que falla con ids asignados (UUID).
spring.jpa.properties.jakarta.persistence.validation.mode=none
