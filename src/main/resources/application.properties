spring.application.name=demo

# ---- Base de datos: Oracle Autonomous Database (BDConfun) ----
# "bdconfun_tp" es uno de los nombres que vienen en wallet/tnsnames.ora
# (tp = pensado para aplicaciones como esta).
# TNS_ADMIN=./wallet le dice al driver dónde está la carpeta del Wallet.
# Es una ruta relativa: funciona al levantar el backend desde esta carpeta (backend).
spring.datasource.url=jdbc:oracle:thin:@bdconfun_tp?TNS_ADMIN=./wallet
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# El usuario y la clave NO van aquí: van en el archivo db.properties
# (al lado de pom.xml), que no se sube a GitHub. Ver db.properties.ejemplo.
spring.config.import=optional:file:./db.properties

# Hibernate crea o actualiza las tablas solo (PRODUCTO y PRODUCTO_SPECS)
# según la clase Producto. Los datos NO se borran al apagar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
