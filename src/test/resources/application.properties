# Tests: base de datos H2 en memoria en modo PostgreSQL (no necesita un servidor)
spring.datasource.url=jdbc:h2:mem:induztek;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Las validaciones (@NotBlank, @NotEmpty...) se revisan al recibir el JSON (@Valid en los controladores).
# Se desactiva la validacion repetida de Hibernate al guardar, que falla con ids asignados (UUID).
spring.jpa.properties.jakarta.persistence.validation.mode=none
